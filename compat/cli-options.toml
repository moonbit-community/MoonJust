[[option]]
name = "--dump-format"
tier = "A"
status = "implemented"

[[option]]
name = "--evaluate-format"
tier = "A"
status = "implemented"

[[option]]
name = "--explain"
tier = "A"
status = "unsupported"
reason = "Recipe documentation is not emitted before execution."

[[option]]
name = "--global-justfile"
short = "-g"
tier = "A"
status = "unsupported"
reason = "Global justfile discovery is not implemented."

[[option]]
name = "--group"
tier = "A"
status = "implemented"
