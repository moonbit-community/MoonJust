schema_version = 1
upstream = "just 1.57.0"

# Status values: implemented, unsupported, excluded.
# Tier values: A, B, W, X.

[[option]]
name = "--alias-style"
tier = "A"
status = "implemented"

[[option]]
name = "--allow-missing"
tier = "A"
status = "unsupported"
reason = "Missing recipes and modules are rejected; --allow-missing execution semantics are not implemented."

[[option]]
name = "--ceiling"
tier = "A"
status = "unsupported"
reason = "Search ceiling control is not implemented."

[[option]]
name = "--check"
tier = "A"
status = "implemented"
requires = ["--fmt"]

[[option]]
name = "--chooser"
tier = "B"
status = "implemented"

[[option]]
name = "--clear-shell-args"
tier = "A"
status = "implemented"

[[option]]
name = "--color"
tier = "A"
status = "implemented"

[[option]]
name = "--command-color"
tier = "A"
status = "implemented"

[[option]]
name = "--complete-aliases"
tier = "X"
status = "excluded"
reason = "Completion is outside project scope."

[[option]]
name = "--cygpath"
tier = "B"
status = "unsupported"
reason = "MoonJust does not perform Cygwin path conversion."

[[option]]
name = "--default-list"
tier = "A"
status = "unsupported"
reason = "Default-list invocation behavior is not implemented."

[[option]]
name = "--dotenv-command"
tier = "A"
status = "unsupported"
reason = "Command-produced dotenv loading is not implemented."

[[option]]
name = "--dotenv-filename"
short = "-F"
tier = "A"
status = "implemented"

[[option]]
name = "--dotenv-path"
