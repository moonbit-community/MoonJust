status = "implemented"

[[option]]
name = "--list-prefix"
tier = "A"
status = "implemented"

[[option]]
name = "--list-submodules"
tier = "A"
status = "unsupported"
reason = "Module recipe listing is not implemented."

[[option]]
name = "--no-aliases"
