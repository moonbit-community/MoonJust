schema_version = 2
area = "release-readiness"
upstream = "just 1.57.0"
status = "blocked"
plan_exit = "strict-gates-pending"
report = "docs/reports/PHASE_11_REPORT.md"
audit = "docs/reports/RELEASE_AUDIT.md"

[contracts]
compatibility = "blocked until every non-completion official registration is exact, diagnostic-exact, or explicitly approved as a scoped compatibility difference"
mooncakes = "complete module metadata, source package validation, documented public facade and exact moonx executable coordinate"
policy = "deny, inspect, CI and execute policies with real capability-denial and allow-path smoke tests"
artifacts = "release-mode Linux, macOS and Windows Native executables plus linear-memory wasm1, SHA-256 checksums and clean extraction smoke tests"
native_matrix = "linux-x86_64, macos-aarch64 and windows-x86_64; macos-x86_64 is excluded because the official MoonBit installer removed Intel macOS toolchain distribution"
supply_chain = "CycloneDX SBOM, SLSA-compatible provenance predicate, checksums and GitHub OIDC artifact attestations bound to commit and toolchain"
upgrade = "cold source-package install, previous-release replacement, corpus execution and byte-preserving rollback without shared project build cache"
publication = "repository automation prepares and attests candidates only; formal Mooncakes publication, tags and GitHub Releases are maintainer-only"

[mooncakes]
module = "ZSeanYves/MoonJust"
version = "0.1.0"
package = "cmd/just"
coordinate = "ZSeanYves/MoonJust/cmd/just@0.1.0"
wasm_asset = "assets/ZSeanYves/MoonJust@0.1.0/cmd/just/just.wasm"
wasm_checksum = "assets/ZSeanYves/MoonJust@0.1.0/cmd/just/just.wasm.sha256"
wasm_sbom = "assets/ZSeanYves/MoonJust@0.1.0/cmd/just/sbom.cdx.json"
wasm_provenance = "assets/ZSeanYves/MoonJust@0.1.0/cmd/just/provenance.intoto.json"

[toolchain]
moon = "0.1.20260803"
moonc = "release CI: 0.10.6+62c2592d1; provenance records the exact builder value"
moonrun = "0.1.20260803"
moonx = "0.1.0"

[evidence]
release_gate = ".github/workflows/release.yml (aggregate evidence job)"
release_evidence = "tools/release/generate_release_evidence.py --strict"
policy_gate = "tools/release/check_policies.py"
artifact_builder = "tools/release/build_artifacts.py"
artifact_verifier = "tools/release/verify_bundle.py"
supply_chain_verifier = "tools/release/verify_supply_chain.py"
upgrade_rehearsal = "tools/release/rehearse_upgrade_orchestrator.py"
release_workflow = ".github/workflows/release.yml"

