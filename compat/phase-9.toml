audit = "docs/PHASE_0_9_AUDIT.md"

[contracts]
scheduler = "bounded FIFO semaphore, stable ready order, serial fences, parallel dependencies, deterministic failures"
cache_key = "versioned length-delimited BLAKE3 key over recipe, body, executor, environment, cwd, arguments, extra, inputs and outputs"
manifest = "strict schema, algorithm, digest, recipe and relative-output validation with corrupt-entry miss recovery"
store = "per-digest permanent OS locks, mode 0600 full-sync temporary files and atomic same-directory rename"
clean = "all-entry and recipe/module-prefix removal while preserving lock and unrelated files"
resources = "streamed process pipes with a 16 MiB per-stream capture budget, cancellation-protected process/script/lease cleanup, bounded hashing and scheduling"
stress = "1000 seeded DAG schedules plus deterministic concurrent output and failure tests"

[compatibility_notes]
clean_storage_tree = "MoonJust preserves permanent digest lock files and therefore does not remove the versioned cache directory after --clean; entry counts, prefix selection, quiet mode and unrelated-file preservation match"
failed_entry = "MoonJust does not publish the empty failed-run entry used by upstream just; the permanent lock remains and a later lease recovers without treating it as a hit"

[target_matrix]
native = "local pass: 263 tests plus scheduler/cache/runtime/store, bounded process output, crash recovery and two-process contention gates"
wasm1 = "local pass: 259 tests plus scheduler/cache/runtime/store, bounded process output and policy-controlled CLI gate"
