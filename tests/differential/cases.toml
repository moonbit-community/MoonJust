schema_version = 3
upstream = "just 1.57.0"

[[case]]
id = "MJ-UPSTREAM-REMAINING-JUSTFILE-RUNTIME"
directory = "upstream-remaining-justfile-runtime"
owner_area = "upstream-blackbox"
status = "match"
compare = ["status", "stdout", "stderr", "tree"]
upstream_tests = ["justfile::tests::code_error", "justfile::tests::export_failure", "justfile::tests::missing_all_arguments", "justfile::tests::missing_all_defaults", "justfile::tests::missing_some_arguments", "justfile::tests::missing_some_arguments_variadic", "justfile::tests::missing_some_defaults", "justfile::tests::run_args", "justfile::tests::unknown_recipe_no_suggestion", "justfile::tests::unknown_recipe_show_alias_suggestion", "justfile::tests::unknown_recipe_with_suggestion"]
upstream_anchors = ["src/justfile.rs:890", "src/justfile.rs:1022", "src/justfile.rs:968", "src/justfile.rs:1004", "src/justfile.rs:932", "src/justfile.rs:950", "src/justfile.rs:986", "src/justfile.rs:911", "src/justfile.rs:836", "src/justfile.rs:867", "src/justfile.rs:850"]
reason = "Runs every remaining upstream justfile execution/error vector as an independent persistent fixture step."

