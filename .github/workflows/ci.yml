name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install MoonBit
        uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: 0.10.6+62c2592d1

      - name: Ensure MoonX entry point
        run: ./tools/release/ensure_moonx.sh

      - name: Report toolchain
        run: moon version --all

      - name: Refresh dependencies
        run: |
          moon update
          moon -C spikes/host-async update
          moon -C spikes/ecosystem update

      - name: Check formatting
        run: moon fmt --check

      - name: Verify architecture boundaries
        run: ./tools/check_architecture.sh

      - name: Verify compatibility snapshot
        run: ./tools/upstream/verify_snapshot.sh

      - name: Test differential harness
        run: ./tools/differential/self_test.sh

      - name: Verify async Host capability spike
        run: ./tools/spikes/check_host_async.sh

      - name: Verify parser ecosystem spike
        run: ./tools/spikes/check_ecosystem.sh

      - name: Cache pinned upstream oracle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _build/upstream/just-1.57.0
          key: just-1.57.0-e01a6bd7-907adacb

      - name: Test real upstream differential smoke
        run: ./tools/differential/real_smoke.sh

      - name: Verify pinned official integration harness
        run: python3 ./tools/upstream/run_official_harness.py

      - name: Verify Phase 5 Rust builtin oracle
        run: python3 ./tools/upstream/phase5_oracle.py --upstream ./_build/upstream/just-1.57.0/target/release/just

      - name: Check all stable backends
        run: moon check --target all --warn-list +73

      - name: Verify Wasm inspect policy
        run: ./tools/check_phase6_inspect.sh

      - name: Verify Phase 7 HostFs policies
        run: ./tools/check_phase7_hostfs.sh

      - name: Verify Phase 7 dotenvy differential
        run: ./tools/check_phase7_dotenv.sh

      - name: Verify Phase 7 invocation differential
        run: ./tools/check_phase7_invocation.sh

      - name: Verify Phase 7 working-directory differential
        run: ./tools/check_phase7_workdir.sh

      - name: Verify Phase 7 environment composition differential
        run: ./tools/check_phase7_environment.sh

      - name: Verify Phase 8 executor
        run: ./tools/check_phase8_executor.sh

      - name: Verify Phase 9 scheduler and cache runtime
        run: ./tools/check_phase9_runtime.sh

      - name: Verify Phase 10 compatibility convergence
        run: ./tools/check_phase10.sh

      - name: Verify Phase 11 release engineering
        run: ./tools/check_phase11.sh

      - name: Verify Phase 6 query oracle
        run: ./tools/check_phase6_oracle.sh

      - name: Verify public interfaces
        run: |
          moon info
          git diff --exit-code

      - name: Test Native
        run: ./tools/test_with_count.sh native

      - name: Test wasm1
        run: ./tools/test_with_count.sh wasm

      - name: Smoke-test Native CLI
        run: moon run --target native cmd/just -- --version

      - name: Smoke-test wasm1 CLI
        run: moon run --target wasm cmd/just -- --version

  native-platforms:
    name: Native smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install MoonBit
        uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: 0.10.6+62c2592d1

      - name: Ensure MoonX entry point
        shell: bash
        run: ./tools/release/ensure_moonx.sh

      - name: Refresh dependencies
        run: moon update

      - name: Test Native
        run: ./tools/test_with_count.sh native

      - name: Smoke-test Native CLI
        run: moon run --target native cmd/just -- --version

      - name: Verify Phase 10 native platform behavior
        shell: bash
        run: ./tools/check_phase10_platform.sh

      - name: Build and verify Phase 11 release artifact
        shell: bash
        env:
          MOONJUST_BUILDER_ID: https://github.com/moonbit-community/MoonJust/.github/workflows/ci.yml
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) platform=linux-x86_64 ;;
            Linux-ARM64) platform=linux-aarch64 ;;
            macOS-X64) platform=macos-x86_64 ;;
            macOS-ARM64) platform=macos-aarch64 ;;
            Windows-X64) platform=windows-x86_64 ;;
            *) echo "unsupported runner ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac
          archive=$(MOONJUST_REQUIRE_CLEAN=1 MOONJUST_RELEASE_PLATFORM="$platform" ./tools/release/build_artifacts.sh)
          python3 ./tools/release/verify_bundle.py \
            --repo . --archive "$archive" --platform "$platform"

      - name: Upload Phase 11 release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-${{ runner.os }}-${{ runner.arch }}
          path: |
            _build/release/moonjust-*
            _build/release/assets/**
            _build/release/build-*.json
          if-no-files-found: error
