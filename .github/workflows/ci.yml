name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MOONJUST_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  fast:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: bash .github/scripts/moon-update.sh
      - name: Run fast tier
        run: python tools/runner.py run --mode fast --evidence _build/verification/fast.json
      - name: Validate exact-head evidence
        run: python tools/runner.py --expected-sha "$MOONJUST_EXPECTED_HEAD_SHA" evidence validate _build/verification/fast.json
      - name: Upload fast evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-verification-fast
          path: _build/verification/fast.json
          if-no-files-found: error

  verify:
    name: Verify gate
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python

      - name: Install MoonBit
        uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest

      - name: Ensure MoonX entry point
        run: python tools/release/ensure_moonx.py

      - name: Report toolchain
        run: moon version --all

      - name: Refresh dependencies
        run: bash .github/scripts/moon-update.sh

      - name: Cache pinned upstream oracle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _build/upstream/just-1.57.0
          key: just-1.57.0-e01a6bd7-907adacb

      - name: Run unified verify runner
        run: python tools/runner.py run --mode verify --tier-only --evidence _build/verification/verify.json

      - name: Validate exact-head evidence
        run: python tools/runner.py --expected-sha "$MOONJUST_EXPECTED_HEAD_SHA" evidence validate _build/verification/verify.json
      - name: Upload verify evidence and registry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-verification-verify
          path: |
            _build/verification/verify.json
            _build/verification/registry/*.json
          if-no-files-found: error

  wasm1-shared:
    name: Shared MoonX wasm1 asset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
      - uses: ./.github/actions/setup-python
      - name: Install MoonBit
        uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - name: Ensure MoonX entry point
        run: python tools/release/ensure_moonx.py
      - run: bash .github/scripts/moon-update.sh
      - run: moon install
      - name: Build wasm1 once on Ubuntu
        run: moon build --frozen --release --strip --target wasm cmd/just
      - name: Build no-strip wasm1 analysis sibling
        run: moon build --frozen --release --no-strip --target wasm --target-dir _build/size-debug cmd/just
      - name: Rebuild stripped wasm1 without cache
        run: MOON_DEP_CACHE=off MOON_BUILD_CACHE=off moon build --frozen --release --strip --target wasm --target-dir _build/wasm-repeat cmd/just
      - name: Stage and hash wasm1
        run: |
          python tools/verification/ci.py stage-shared-wasm \
            --source _build/wasm/release/build/cmd/just/just.wasm \
            --debug _build/size-debug/wasm/release/build/cmd/just/just.wasm \
            --repeat _build/wasm-repeat/wasm/release/build/cmd/just/just.wasm \
            --out _build/shared-wasm
      - name: Upload shared wasm1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-ci-wasm1
          path: _build/shared-wasm/**
          if-no-files-found: error

  native-platforms:
    name: Native smoke (${{ matrix.os }})
    needs: wasm1-shared
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python

      - name: Install MoonBit
        uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest

      - name: Ensure MoonX entry point
        run: python tools/release/ensure_moonx.py

      - name: Refresh dependencies
        run: |
          bash .github/scripts/moon-update.sh
          moon install

      - name: Download shared wasm1 asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moonjust-ci-wasm1
          path: _build/shared-wasm

      - name: Verify shared wasm1 checksum
        run: python tools/verification/ci.py verify-shared-wasm --asset _build/shared-wasm/just.wasm --sidecar _build/shared-wasm/just.wasm.sha256

      - name: Build platform Native debug artifact through registry
        run: python tools/runner.py build --target native --profile debug

      - name: Run Native verification tier
        run: python tools/runner.py run --mode verify --no-build --task native-tests --task native-version --evidence _build/verification/platform-verify.json

      - name: Run platform compatibility tier
        env:
          MOONJUST_NATIVE_CANDIDATE: ${{ github.workspace }}/_build/native/debug/build/cmd/just/just.exe
          MOONJUST_WASM_CANDIDATE: ${{ github.workspace }}/_build/shared-wasm/just.wasm
          MOONJUST_PLATFORM_SKIP_TESTS: "1"
        run: python tools/runner.py run --mode compat --tier-only --no-build --task platform --task wasm-platform --evidence _build/verification/platform-compat.json
      - name: Run Linux official harness
        if: matrix.os == 'ubuntu-latest'
        env:
          MOONJUST_NATIVE_CANDIDATE: ${{ github.workspace }}/_build/native/debug/build/cmd/just/just.exe
          MOONJUST_WASM_CANDIDATE: ${{ github.workspace }}/_build/shared-wasm/just.wasm
          MOONJUST_PLATFORM_SKIP_TESTS: "1"
        run: python tools/runner.py run --mode compat --tier-only --no-build --task official-harness --evidence _build/verification/platform-official.json

      - name: Validate Native platform evidence
        run: python tools/runner.py --expected-sha "${{ env.MOONJUST_EXPECTED_HEAD_SHA }}" evidence validate _build/verification/platform-verify.json
      - name: Validate compatibility platform evidence
        run: python tools/runner.py --expected-sha "${{ env.MOONJUST_EXPECTED_HEAD_SHA }}" evidence validate _build/verification/platform-compat.json

      - name: Build and verify Release artifact
        if: github.event_name != 'pull_request'
        env:
          MOONJUST_BUILDER_ID: https://github.com/moonbit-community/MoonJust/.github/workflows/ci.yml
          MOONJUST_REQUIRE_CLEAN: "1"
        run: python tools/verification/ci.py platform-release --repo . --platform "${{ matrix.platform }}" --wasm _build/shared-wasm/just.wasm --base-ref origin/main

      - name: Upload Release artifact
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-ci-${{ matrix.platform }}
          path: |
            _build/release/moonjust-*
            _build/release/assets/**
            _build/release/build-*.json
            _build/release/artifact-size-*.json
            _build/release/repeatability-*.json
            _build/verification/*.json
            _build/size-baseline.json
            _build/release/build/native/release/build/cmd/just/just.exe
            _build/upstream-harness/**
          if-no-files-found: error

  contract-evidence:
    name: One-to-one contract evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: bash .github/scripts/moon-update.sh
      - run: moon install
      - name: Execute every unique contract on native and wasm1
        run: python tools/runner.py run --mode release --tier-only --task contracts --evidence _build/verification/contracts.json
      - name: Upload contract results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-contract-evidence
          path: |
            _build/upstream-contracts/results.jsonl
            _build/upstream-contracts/batches.jsonl
            _build/verification/contracts.json
          if-no-files-found: error
      - name: Enforce strict registration evidence
        run: python ./tools/upstream/verify_manifest.py --release

  compat:
    name: Compatibility gate
    if: always()
    needs: [verify, native-platforms, contract-evidence]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
      - uses: ./.github/actions/setup-python
      - name: Enforce compatibility prerequisites
        run: python tools/verification/ci.py require-results "${{ needs.verify.result }}" "${{ needs['native-platforms'].result }}" "${{ needs['contract-evidence'].result }}"

  coverage-native:
    name: Production coverage (Native)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: bash .github/scripts/moon-update.sh
      - run: moon install
      - name: Measure Native coverage
        run: python tools/runner.py coverage --target native
      - name: Upload Native coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-coverage-native
          path: |
            _build/coverage/native.raw.xml
            _build/coverage/native.metadata.json
            _build/coverage/native/traces/**
          if-no-files-found: error

  coverage-wasm:
    name: Production coverage (Wasm)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: bash .github/scripts/moon-update.sh
      - run: moon install
      - name: Measure Wasm coverage
        run: python tools/runner.py coverage --target wasm
      - name: Upload Wasm coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-coverage-wasm
          path: |
            _build/coverage/wasm.raw.xml
            _build/coverage/wasm.metadata.json
            _build/coverage/wasm/traces/**
          if-no-files-found: error

  benchmark:
    name: Hosted benchmark (${{ matrix.platform }}, batch ${{ matrix.batch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            batch: 1
          - os: ubuntu-latest
            platform: linux-x86_64
            batch: 2
          - os: ubuntu-latest
            platform: linux-x86_64
            batch: 3
          - os: macos-latest
            platform: macos-aarch64
            batch: 1
          - os: macos-latest
            platform: macos-aarch64
            batch: 2
          - os: macos-latest
            platform: macos-aarch64
            batch: 3
          - os: windows-latest
            platform: windows-x86_64
            batch: 1
          - os: windows-latest
            platform: windows-x86_64
            batch: 2
          - os: windows-latest
            platform: windows-x86_64
            batch: 3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: python tools/release/ensure_moonx.py
      - run: |
          bash .github/scripts/moon-update.sh
          moon install
      - name: Run report-only benchmark
        run: python tools/runner.py measure --report-only --cold-warm --seed ${{ matrix.batch }} --output _build/performance/results.json
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-performance-${{ matrix.platform }}-batch-${{ matrix.batch }}
          path: _build/performance/**
          if-no-files-found: error

  benchmark-pr:
    name: PR benchmark (${{ matrix.platform }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: python tools/release/ensure_moonx.py
      - run: |
          bash .github/scripts/moon-update.sh
          moon install
      - name: Run one paired benchmark batch
        run: python tools/runner.py measure --report-only --cold-warm --seed 100 --output _build/performance/results.json
      - name: Upload PR performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-performance-pr-${{ matrix.platform }}
          path: _build/performance/**
          if-no-files-found: error

  performance-gate-pr:
    name: PR performance gate
    if: github.event_name == 'pull_request' && always()
    needs: [benchmark-pr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: moonjust-performance-pr-*
          path: evidence/performance
          merge-multiple: false
      - name: Enforce PR relative performance budget
        if: always()
        run: |
          python tools/performance/check_thresholds.py \
            --mode pr \
            --expected-commit "$MOONJUST_EXPECTED_HEAD_SHA" \
            --baseline compat/performance-ratio-baseline.json \
            --report linux-x86_64=evidence/performance/moonjust-performance-pr-linux-x86_64/results.json \
            --report macos-aarch64=evidence/performance/moonjust-performance-pr-macos-aarch64/results.json \
            --report windows-x86_64=evidence/performance/moonjust-performance-pr-windows-x86_64/results.json \
            --output evidence/performance/performance-gate.json
      - name: Upload PR performance gate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-performance-gate-pr
          path: evidence/performance/performance-gate.json
          if-no-files-found: error

  performance-gate:
    name: Main performance gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always()
    needs: [benchmark]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: moonjust-performance-*-batch-*
          path: evidence/performance
          merge-multiple: false
      - name: Enforce three-batch absolute performance gate
        if: always()
        run: |
          python tools/performance/check_thresholds.py \
            --mode strict \
            --expected-commit "$MOONJUST_EXPECTED_HEAD_SHA" \
            --report linux-x86_64=evidence/performance/moonjust-performance-linux-x86_64-batch-1/results.json \
            --report linux-x86_64=evidence/performance/moonjust-performance-linux-x86_64-batch-2/results.json \
            --report linux-x86_64=evidence/performance/moonjust-performance-linux-x86_64-batch-3/results.json \
            --report macos-aarch64=evidence/performance/moonjust-performance-macos-aarch64-batch-1/results.json \
            --report macos-aarch64=evidence/performance/moonjust-performance-macos-aarch64-batch-2/results.json \
            --report macos-aarch64=evidence/performance/moonjust-performance-macos-aarch64-batch-3/results.json \
            --report windows-x86_64=evidence/performance/moonjust-performance-windows-x86_64-batch-1/results.json \
            --report windows-x86_64=evidence/performance/moonjust-performance-windows-x86_64-batch-2/results.json \
            --report windows-x86_64=evidence/performance/moonjust-performance-windows-x86_64-batch-3/results.json \
            --output evidence/performance/performance-gate.json
      - name: Upload main performance gate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-performance-gate
          path: evidence/performance/performance-gate.json
          if-no-files-found: error

  release-evidence:
    name: Aggregate release evidence
    if: github.event_name != 'pull_request' && always()
    needs: [fast, verify, compat, wasm1-shared, native-platforms, contract-evidence, coverage-native, coverage-wasm, benchmark, performance-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-ci-linux-x86_64
          path: evidence/linux-x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-ci-macos-aarch64
          path: evidence/macos-aarch64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-ci-windows-x86_64
          path: evidence/windows-x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-ci-wasm1
          path: evidence/wasm1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-coverage-native
          path: _build/coverage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-coverage-wasm
          path: _build/coverage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: moonjust-performance-*-batch-*
          path: evidence/performance
          merge-multiple: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-performance-gate
          path: evidence/performance/gate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-contract-evidence
          path: evidence/contracts
      - name: Validate and aggregate evidence
        if: always()
        run: |
          python tools/runner.py coverage --target merge
          python tools/performance/aggregate_cloud.py \
            --expected-sha "$MOONJUST_EXPECTED_HEAD_SHA" \
            --report linux-x86_64=evidence/performance/moonjust-performance-linux-x86_64-batch-1/results.json \
            --report macos-aarch64=evidence/performance/moonjust-performance-macos-aarch64-batch-1/results.json \
            --report windows-x86_64=evidence/performance/moonjust-performance-windows-x86_64-batch-1/results.json \
            --output evidence/performance/results.json
