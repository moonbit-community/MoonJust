name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MOONJUST_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  fast:
    name: Fast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: moon update
      - name: Run fast tier
        run: python3 tools/runner.py run --mode fast --evidence _build/verification/fast.json
      - name: Validate exact-head evidence
        run: python3 tools/runner.py --expected-sha "$MOONJUST_EXPECTED_HEAD_SHA" evidence validate _build/verification/fast.json
      - name: Upload fast evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-verification-fast
          path: _build/verification/fast.json
          if-no-files-found: error

  verify:
    name: Verify gate
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0

      - name: Install MoonBit
        uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest

      - name: Ensure MoonX entry point
        run: ./tools/release/ensure_moonx.sh

      - name: Report toolchain
        run: moon version --all

      - name: Refresh dependencies
        run: |
          moon update
          moon -C spikes/host-async update
          moon -C spikes/ecosystem update

      - name: Cache pinned upstream oracle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _build/upstream/just-1.57.0
          key: just-1.57.0-e01a6bd7-907adacb

      - name: Run unified verify runner
        run: python3 tools/runner.py run --mode verify --tier-only --evidence _build/verification/verify.json

      - name: Validate exact-head evidence
        run: python3 tools/runner.py --expected-sha "$MOONJUST_EXPECTED_HEAD_SHA" evidence validate _build/verification/verify.json
      - name: Upload verify evidence and registry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-verification-verify
          path: |
            _build/verification/verify.json
            _build/verification/registry/*.json
          if-no-files-found: error

      - name: Upload async lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-host-async-lifecycle-linux
          path: |
            _build/host-async/process-lifecycle.jsonl
            _build/host-async/moonjust-process-group.jsonl
          if-no-files-found: error

  wasm1-shared:
    name: Shared MoonX wasm1 asset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
      - name: Install MoonBit
        uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - name: Ensure MoonX entry point
        run: ./tools/release/ensure_moonx.sh
      - run: moon update
      - run: moon install
      - name: Build wasm1 once on Ubuntu
        run: moon build --frozen --release --strip --target wasm cmd/just
      - name: Build no-strip wasm1 analysis sibling
        run: moon build --frozen --release --no-strip --target wasm --target-dir _build/size-debug cmd/just
      - name: Rebuild stripped wasm1 without cache
        run: MOON_DEP_CACHE=off MOON_BUILD_CACHE=off moon build --frozen --release --strip --target wasm --target-dir _build/wasm-repeat cmd/just
      - name: Stage and hash wasm1
        shell: bash
        run: |
          mkdir -p _build/shared-wasm
          cp _build/wasm/release/build/cmd/just/just.wasm _build/shared-wasm/just.wasm
          cp _build/size-debug/wasm/release/build/cmd/just/just.wasm _build/shared-wasm/just.debug.wasm
          sha256sum _build/shared-wasm/just.wasm | sed 's#_build/shared-wasm/##' > _build/shared-wasm/just.wasm.sha256
          python3 tools/release/check_repeatable_artifacts.py \
            --platform wasm1 \
            --pair wasm1=_build/shared-wasm/just.wasm=_build/wasm-repeat/wasm/release/build/cmd/just/just.wasm \
            --output _build/shared-wasm/repeatability.json
      - name: Upload shared wasm1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-ci-wasm1
          path: _build/shared-wasm/**
          if-no-files-found: error

  native-platforms:
    name: Native smoke (${{ matrix.os }})
    needs: wasm1-shared
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0

      - name: Install MoonBit
        uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest

      - name: Ensure MoonX entry point
        shell: bash
        run: ./tools/release/ensure_moonx.sh

      - name: Add Git Bash to Windows PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'

      - name: Refresh dependencies
        run: |
          moon update
          moon install

      - name: Download shared wasm1 asset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        with:
          name: moonjust-ci-wasm1
          path: _build/shared-wasm

      - name: Verify shared wasm1 checksum
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          asset = Path("_build/shared-wasm/just.wasm")
          sidecar = Path("_build/shared-wasm/just.wasm.sha256").read_text().split()
          actual = hashlib.sha256(asset.read_bytes()).hexdigest()
          if len(sidecar) != 2 or sidecar[0] != actual or sidecar[1] != "just.wasm":
              raise SystemExit("shared wasm1 checksum mismatch")
          PY

      - name: Build platform Native debug artifact through registry
        run: python3 tools/runner.py build --target native --profile debug

      - name: Run Native verification tier
        run: python3 tools/runner.py run --mode verify --no-build --task native-tests --task native-version --evidence _build/verification/platform-verify.json

      - name: Run platform compatibility tier
        env:
          MOONJUST_NATIVE_CANDIDATE: ${{ github.workspace }}/_build/native/debug/build/cmd/just/just.exe
          MOONJUST_WASM_CANDIDATE: ${{ github.workspace }}/_build/shared-wasm/just.wasm
          MOONJUST_PLATFORM_SKIP_TESTS: "1"
        run: python3 tools/runner.py run --mode compat --tier-only --no-build --task platform --task official-harness --evidence _build/verification/platform-compat.json

      - name: Validate platform evidence
        run: |
          python3 tools/runner.py --expected-sha "$MOONJUST_EXPECTED_HEAD_SHA" evidence validate _build/verification/platform-verify.json
          python3 tools/runner.py --expected-sha "$MOONJUST_EXPECTED_HEAD_SHA" evidence validate _build/verification/platform-compat.json

      - name: Build and verify Release artifact
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          MOONJUST_BUILDER_ID: https://github.com/moonbit-community/MoonJust/.github/workflows/ci.yml
        run: |
          platform="${{ matrix.platform }}"
          archive=$(MOONJUST_REQUIRE_CLEAN=1 MOONJUST_RELEASE_PLATFORM="$platform" \
            MOONJUST_WASM_ASSET="$GITHUB_WORKSPACE/_build/shared-wasm/just.wasm" \
            ./tools/release/build_artifacts.sh)
          python3 ./tools/release/verify_bundle.py \
            --repo . --archive "$archive" --platform "$platform"
          mkdir -p _build/repeat-first
          cp "$archive" _build/repeat-first/archive
          cp _build/release/build/native/release/build/cmd/just/just.exe \
            _build/repeat-first/native
          archive=$(MOONJUST_REQUIRE_CLEAN=1 MOONJUST_RELEASE_PLATFORM="$platform" \
            MOONJUST_WASM_ASSET="$GITHUB_WORKSPACE/_build/shared-wasm/just.wasm" \
            ./tools/release/build_artifacts.sh)
          python3 ./tools/release/verify_bundle.py \
            --repo . --archive "$archive" --platform "$platform"
          python3 ./tools/release/check_repeatable_artifacts.py \
            --platform "$platform" \
            --pair native=_build/repeat-first/native=_build/release/build/native/release/build/cmd/just/just.exe \
            --pair archive=_build/repeat-first/archive="$archive" \
            --output "_build/release/repeatability-$platform.json"
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' moon.mod)
          python3 ./tools/release/check_moonx_asset.py \
            --repo . --registry _build/release \
            --coordinate "moonbit-community/MoonJust/cmd/just@$version"
          base_ref="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base_ref" ]; then base_ref=origin/main; fi
          python3 ./tools/release/build_size_baseline.py \
            --repo . --base-ref "$base_ref" --platform "$platform" \
            --output _build/size-baseline.json
          moon build --frozen --release --no-strip --target native \
            --target-dir _build/size-debug cmd/just
          python3 ./tools/release/check_artifact_size.py \
            --baseline-report _build/size-baseline.json \
            --platform "$platform" \
            --native _build/release/build/native/release/build/cmd/just/just.exe \
            --wasm _build/shared-wasm/just.wasm \
            --native-debug _build/size-debug/native/release/build/cmd/just/just.exe \
            --wasm-debug _build/shared-wasm/just.debug.wasm \
            --archive "$archive" \
            --require-complete-baseline \
            --output "_build/release/artifact-size-$platform.json"

      - name: Upload Release artifact
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-ci-${{ matrix.platform }}
          path: |
            _build/release/moonjust-*
            _build/release/assets/**
            _build/release/build-*.json
            _build/release/artifact-size-*.json
            _build/release/repeatability-*.json
            _build/verification/*.json
            _build/size-baseline.json
            _build/release/build/native/release/build/cmd/just/just.exe
            _build/upstream-harness/**
          if-no-files-found: error

  contract-evidence:
    name: One-to-one contract evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: moon update
      - run: moon install
      - name: Execute every unique contract on native and wasm1
        run: python3 tools/runner.py run --mode release --tier-only --task contracts --evidence _build/verification/contracts.json
      - name: Upload contract results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-contract-evidence
          path: |
            _build/upstream-contracts/results.jsonl
            _build/upstream-contracts/batches.jsonl
            _build/verification/contracts.json
          if-no-files-found: error
      - name: Enforce strict registration evidence
        run: python3 ./tools/upstream/verify_manifest.py --release

  compat:
    name: Compatibility gate
    if: always()
    needs: [verify, native-platforms, contract-evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce compatibility prerequisites
        run: |
          test "${{ needs.verify.result }}" = success
          test "${{ needs['native-platforms'].result }}" = success
          test "${{ needs['contract-evidence'].result }}" = success

  coverage-native:
    name: Production coverage (Native)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: moon update
      - run: moon install
      - name: Measure Native coverage
        run: python3 tools/runner.py coverage --target native
      - name: Upload Native coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-coverage-native
          path: |
            _build/coverage/native.raw.xml
            _build/coverage/native.metadata.json
            _build/coverage/native/traces/**
          if-no-files-found: error

  coverage-wasm:
    name: Production coverage (Wasm)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: moon update
      - run: moon install
      - name: Measure Wasm coverage
        run: python3 tools/runner.py coverage --target wasm
      - name: Upload Wasm coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-coverage-wasm
          path: |
            _build/coverage/wasm.raw.xml
            _build/coverage/wasm.metadata.json
            _build/coverage/wasm/traces/**
          if-no-files-found: error

  coverage-merge:
    name: Production coverage (Merge)
    needs: [coverage-native, coverage-wasm]
    if: github.event_name != 'pull_request' && always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        with:
          name: moonjust-coverage-native
          path: _build/coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        with:
          name: moonjust-coverage-wasm
          path: _build/coverage
      - name: Merge and enforce production coverage
        run: |
          coverage_base=$(tr -d '[:space:]' < compat/stage0-coverage-baseline.sha)
          python3 tools/runner.py coverage --target merge --base "$coverage_base"
      - name: Upload merged coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-coverage-evidence
          path: _build/coverage/**
          if-no-files-found: error

  performance-trend:
    name: Hosted Linux performance trend
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: ./tools/release/ensure_moonx.sh
      - run: |
          moon update
          moon install
      - name: Run non-authoritative interleaved benchmark
        run: python3 tools/runner.py measure --report-only --output _build/performance/results.json
      - name: Upload trend evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-performance-trend
          path: _build/performance/**
          if-no-files-found: error

  release-evidence:
    name: Aggregate release evidence
    if: github.event_name != 'pull_request' && always()
    needs: [fast, verify, compat, wasm1-shared, native-platforms, contract-evidence, coverage-merge, performance-trend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        continue-on-error: true
        with:
          name: moonjust-ci-linux-x86_64
          path: evidence/linux-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        continue-on-error: true
        with:
          name: moonjust-ci-macos-aarch64
          path: evidence/macos-aarch64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        continue-on-error: true
        with:
          name: moonjust-ci-windows-x86_64
          path: evidence/windows-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        continue-on-error: true
        with:
          name: moonjust-ci-wasm1
          path: evidence/wasm1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        continue-on-error: true
        with:
          name: moonjust-coverage-evidence
          path: evidence/coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        continue-on-error: true
        with:
          name: moonjust-performance-trend
          path: evidence/performance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        continue-on-error: true
        with:
          name: moonjust-contract-evidence
          path: evidence/contracts
      - name: Validate and aggregate evidence
        if: always()
        shell: bash
        run: |
          python3 tools/release/generate_release_evidence.py \
            --mode pr \
            --test-map tests/upstream/just-1.57.0/test-map.jsonl \
            --contract-results evidence/contracts/results.jsonl \
            --compat-report linux-x86_64=evidence/linux-x86_64/upstream-harness/compatibility-report.jsonl \
            --compat-report macos-aarch64=evidence/macos-aarch64/upstream-harness/compatibility-report.jsonl \
            --compat-report windows-x86_64=evidence/windows-x86_64/upstream-harness/compatibility-report.jsonl \
            --coverage evidence/coverage/summary.json \
            --coverage-metadata native=evidence/coverage/native.metadata.json \
            --coverage-metadata wasm=evidence/coverage/wasm.metadata.json \
            --performance evidence/performance/results.json \
            --size-report linux-x86_64=evidence/linux-x86_64/release/artifact-size-linux-x86_64.json \
            --size-report macos-aarch64=evidence/macos-aarch64/release/artifact-size-macos-aarch64.json \
            --size-report windows-x86_64=evidence/windows-x86_64/release/artifact-size-windows-x86_64.json \
            --native linux-x86_64=evidence/linux-x86_64/release/build/native/release/build/cmd/just/just.exe \
            --native macos-aarch64=evidence/macos-aarch64/release/build/native/release/build/cmd/just/just.exe \
            --native windows-x86_64=evidence/windows-x86_64/release/build/native/release/build/cmd/just/just.exe \
            --wasm evidence/wasm1/just.wasm \
            --build-proof linux-x86_64=evidence/linux-x86_64/release/build-linux-x86_64.json \
            --build-proof macos-aarch64=evidence/macos-aarch64/release/build-macos-aarch64.json \
            --build-proof windows-x86_64=evidence/windows-x86_64/release/build-windows-x86_64.json \
            --repeatability linux-x86_64=evidence/linux-x86_64/release/repeatability-linux-x86_64.json \
            --repeatability macos-aarch64=evidence/macos-aarch64/release/repeatability-macos-aarch64.json \
            --repeatability windows-x86_64=evidence/windows-x86_64/release/repeatability-windows-x86_64.json \
            --repeatability wasm1=evidence/wasm1/repeatability.json \
            --output _build/release-evidence.json \
            --strict
      - name: Check prerequisite job results
        if: always()
        shell: bash
        run: |
          for result in \
            "${{ needs.fast.result }}" \
            "${{ needs.verify.result }}" \
            "${{ needs.compat.result }}" \
            "${{ needs['wasm1-shared'].result }}" \
            "${{ needs['native-platforms'].result }}" \
            "${{ needs['contract-evidence'].result }}" \
            "${{ needs['coverage-merge'].result }}" \
            "${{ needs['performance-trend'].result }}"; do
            [ "$result" = success ] || exit 1
          done
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-release-evidence
          path: _build/release-evidence.json
          if-no-files-found: error
