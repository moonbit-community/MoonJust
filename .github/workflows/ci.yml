name: Check, build and test

on:
  merge_group:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: latest
      - run: moon version --all
      - run: moon update
      - run: moon info
      - run: moon fmt --check
      - run: moon fmt --check tests/wasm_contract.mbtx
      - run: test -z "$(git status --porcelain --untracked-files=all -- '*.mbti')"
      - name: Check production source boundary
        shell: bash
        run: |
          if git grep -nE 'moonbitlang/async([/@"]|$)' -- '*.mbt' '*.mbtx' 'moon.pkg' '**/moon.pkg' 'moon.mod'; then exit 1; fi
          if git grep -nE '(^|[[:space:]])extern[[:space:]]+"|^[[:space:]]*#(external|intrinsic|import)\b|=[[:space:]]*"[^" ]+"[[:space:]]+"[^" ]+"|wasi_snapshot_preview1|native-stub' -- '*.mbt' 'moon.pkg' '**/moon.pkg' 'moon.mod' ':!tests/**'; then exit 1; fi
          test -z "$(git ls-files '*.c' '*.h' '*.S' '*.wat' '*.js' '*.rs' ':!tests/**')"
      - run: moon check --target wasm --deny-warn
      - run: moon build --release --target wasm .
      - run: moon check --target native --deny-warn
      - run: moon test --target native
      - run: moon run tests/wasm_contract.mbtx
      - run: moon run tests/cache_contract.mbtx
