name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moonbit:
    name: MoonBit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: latest
      - run: moon version --all
      - run: moon update
      - run: cargo install just --version 1.57.0 --locked
      - run: moon check --target native
      - run: moon test --target native
      - run: moon build --release --target native .
      - run: moon run --target native . -- --version
      - run: moon run --target native ./tests/platform -- --candidate _build/native/release/build/MoonJust.exe --official just
      - run: moon check --target wasm
      - run: moon test --target wasm
      - run: moon build --release --target wasm .
      - run: moon run --target wasm . -- --version
      - name: Benchmark native
        run: >-
          moon run --target native ./tests/benchmark --
          --candidate _build/native/release/build/MoonJust.exe
          --official just
          --target native
          --batches ${{ github.event_name == 'pull_request' && 1 || 3 }}
          --rounds 15
          --output _build/performance-gate-native.json
      - name: Benchmark wasm
        run: >-
          moon run --target native ./tests/benchmark --
          --candidate _build/wasm/release/build/MoonJust.wasm
          --candidate-runner moonrun
          --official just
          --target wasm
          --batches ${{ github.event_name == 'pull_request' && 1 || 3 }}
          --rounds 15
          --output _build/performance-gate-wasm.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-${{ matrix.os }}
          path: _build/performance-gate-*.json
          if-no-files-found: error

  wasm:
    name: Wasm behavior and size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: latest
      - run: moon update
      - run: moon check --target wasm
      - run: moon test --target wasm
      - run: moon build --release --target wasm .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: moonjust-wasm
          path: _build/wasm/release/build/MoonJust.wasm
          if-no-files-found: error

  compatibility:
    name: just 1.57 differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: latest
      - run: moon update
      - run: cargo install just --version 1.57.0 --locked
      - run: moon build --release --target native .
      - run: moon run --target native ./tests/compat -- --candidate _build/native/release/build/MoonJust.exe --official just --coverage-report _build/coverage.json
      - run: moon run --target native ./tests/benchmark -- --candidate _build/native/release/build/MoonJust.exe --official just --target native --batches 1 --rounds 15 --output _build/performance-gate-native.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compatibility-and-performance
          path: _build/coverage.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compatibility-performance-gate
          path: _build/performance-gate-native.json
          if-no-files-found: error

  quality:
    name: Format and interfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: latest
      - run: moon update
      - run: moon info
      - run: moon fmt --check
