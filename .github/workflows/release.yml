name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONJUST_BUILDER_ID: https://github.com/moonbit-community/MoonJust/.github/workflows/release.yml
  MOONJUST_EXPECTED_HEAD_SHA: ${{ github.sha }}

jobs:
  correctness:
    name: Release correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: python tools/release/ensure_moonx.py
      - run: moon update
      - run: moon install
      - name: Verify source and generated interfaces
        run: python tools/runner.py run --mode verify --evidence _build/verification/release-correctness.json
      - name: Verify measurement tooling
        run: python tools/runner.py test-tools
      - name: Validate exact-head evidence
        run: python tools/runner.py --expected-sha "$MOONJUST_EXPECTED_HEAD_SHA" evidence validate _build/verification/release-correctness.json

  wasm-asset:
    name: Ubuntu MoonX wasm1 asset
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: python tools/release/ensure_moonx.py
      - run: moon update
      - run: moon install
      - name: Build stripped wasm1
        env:
          MOON_DEP_CACHE: "off"
          MOON_BUILD_CACHE: "off"
        run: moon build --frozen --release --strip --target wasm cmd/just
      - name: Build no-strip wasm1 analysis sibling
        run: moon build --frozen --release --no-strip --target wasm --target-dir _build/size-debug cmd/just
      - name: Rebuild stripped wasm1 without cache
        env:
          MOON_DEP_CACHE: "off"
          MOON_BUILD_CACHE: "off"
        run: moon build --frozen --release --strip --target wasm --target-dir _build/wasm-repeat cmd/just
      - name: Build release staging and no-strip analysis sibling
        env:
          MOONJUST_REQUIRE_CLEAN: "1"
          MOONJUST_RELEASE_PLATFORM: linux-x86_64
        run: python tools/release/build_artifacts.py --repo . --platform linux-x86_64 --wasm-asset _build/wasm/release/build/cmd/just/just.wasm
      - name: Stage and verify shared wasm1
        run: python tools/verification/ci.py stage-shared-wasm --source _build/wasm/release/build/cmd/just/just.wasm --debug _build/size-debug/wasm/release/build/cmd/just/just.wasm --repeat _build/wasm-repeat/wasm/release/build/cmd/just/just.wasm --out _build/shared-wasm
      - name: Verify MoonX asset
        run: python tools/verification/ci.py verify-moonx --repo . --registry _build/release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: _build/shared-wasm/**
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-release-wasm1
          path: _build/shared-wasm/**
          if-no-files-found: error

  artifacts:
    name: Release artifact (${{ matrix.platform }})
    needs: wasm-asset
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - name: Ensure MoonX entry point
        run: python tools/release/ensure_moonx.py
      - run: moon update
      - run: moon install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moonjust-release-wasm1
          path: _build/shared-wasm
      - name: Verify shared wasm1 checksum
        run: python tools/verification/ci.py verify-shared-wasm --asset _build/shared-wasm/just.wasm --sidecar _build/shared-wasm/just.wasm.sha256
      - name: Build platform Native debug artifact through registry
        run: python tools/runner.py build --target native --profile debug
      - name: Verify native and shared wasm1 behavior
        env:
          MOONJUST_NATIVE_CANDIDATE: ${{ github.workspace }}/_build/native/debug/build/cmd/just/just.exe
          MOONJUST_WASM_CANDIDATE: ${{ github.workspace }}/_build/shared-wasm/just.wasm
        run: python tools/runner.py run --mode verify --no-build --task native-tests --task native-version --evidence _build/verification/release-native.json
      - name: Verify platform compatibility
        env:
          MOONJUST_NATIVE_CANDIDATE: ${{ github.workspace }}/_build/native/debug/build/cmd/just/just.exe
          MOONJUST_WASM_CANDIDATE: ${{ github.workspace }}/_build/shared-wasm/just.wasm
          MOONJUST_PLATFORM_SKIP_TESTS: "1"
        run: python tools/runner.py run --mode compat --tier-only --no-build --task platform --task wasm-platform --evidence _build/verification/release-platform.json
      - name: Verify Linux official harness
        if: matrix.platform == 'linux-x86_64'
        env:
          MOONJUST_NATIVE_CANDIDATE: ${{ github.workspace }}/_build/native/debug/build/cmd/just/just.exe
          MOONJUST_WASM_CANDIDATE: ${{ github.workspace }}/_build/shared-wasm/just.wasm
          MOONJUST_PLATFORM_SKIP_TESTS: "1"
        run: python tools/runner.py run --mode compat --tier-only --no-build --task official-harness --evidence _build/verification/release-official.json
      - name: Build, inspect, and enforce release size
        env:
          MOONJUST_BUILDER_ID: https://github.com/moonbit-community/MoonJust/.github/workflows/release.yml
          MOONJUST_REQUIRE_CLEAN: "1"
        run: python tools/verification/ci.py platform-release --repo . --platform "${{ matrix.platform }}" --wasm _build/shared-wasm/just.wasm --base-ref origin/main
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            _build/release/moonjust-*.tar.gz
            _build/release/moonjust-*.zip
            _build/release/moonjust-*.sha256
            _build/release/build-*.json
            _build/release/artifact-size-*.json
            _build/release/repeatability-*.json
            _build/size-baseline.json
      - name: Upload release evidence and assets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-release-${{ matrix.platform }}
          path: |
            _build/release/moonjust-*
            _build/release/assets/**
            _build/release/build-*.json
            _build/release/artifact-size-*.json
            _build/release/repeatability-*.json
            _build/size-baseline.json
            _build/release/build/native/release/build/cmd/just/just.exe
            _build/upstream-harness/**
            _build/verification/release-platform.json
            _build/verification/release-official.json
          if-no-files-found: error

  contracts:
    name: Release contract evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: moon update
      - run: moon install
      - run: python tools/upstream/build_oracle.py
      - run: python ./tools/upstream/run_contract_harness.py
      - name: Enforce complete one-to-one evidence
        run: python ./tools/upstream/verify_manifest.py --release
      - name: Upload contract results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-release-contracts
          path: _build/upstream-contracts/results.jsonl
          if-no-files-found: error

  coverage-native:
    name: Release production coverage (Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: moon update
      - run: moon install
      - run: python tools/runner.py coverage --target native
      - name: Upload Native coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-release-coverage-native
          path: |
            _build/coverage/native.raw.xml
            _build/coverage/native.metadata.json
            _build/coverage/native/traces/**
          if-no-files-found: error

  coverage-wasm:
    name: Release production coverage (Wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - run: moon update
      - run: moon install
      - run: python tools/runner.py coverage --target wasm
      - name: Upload Wasm coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-release-coverage-wasm
          path: |
            _build/coverage/wasm.raw.xml
            _build/coverage/wasm.metadata.json
            _build/coverage/wasm/traces/**
          if-no-files-found: error

  performance:
    name: Release cloud performance (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    concurrency:
      group: moonjust-cloud-performance-${{ matrix.platform }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - name: Ensure MoonX entry point
        run: python tools/release/ensure_moonx.py
      - run: moon update
      - run: moon install
      - name: Run hosted cloud trend benchmark
        run: python tools/runner.py measure --report-only --cold-warm --output _build/performance/results.json
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-release-performance-${{ matrix.platform }}
          path: _build/performance/**
          if-no-files-found: error

  evidence:
    name: Aggregate release evidence
    if: always()
    needs: [correctness, wasm-asset, artifacts, contracts, coverage-native, coverage-wasm, performance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-release-linux-x86_64
          path: evidence/linux-x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-release-macos-aarch64
          path: evidence/macos-aarch64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-release-windows-x86_64
          path: evidence/windows-x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-release-wasm1
          path: evidence/wasm1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-release-contracts
          path: evidence/contracts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-release-coverage-native
          path: _build/coverage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-release-coverage-wasm
          path: _build/coverage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-release-performance-linux-x86_64
          path: evidence/performance/linux-x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-release-performance-macos-aarch64
          path: evidence/performance/macos-aarch64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: moonjust-release-performance-windows-x86_64
          path: evidence/performance/windows-x86_64
      - name: Aggregate cloud performance trend
        if: always()
        run: python tools/runner.py coverage --target merge
      - name: Aggregate cloud performance evidence
        if: always()
        run: python tools/performance/aggregate_cloud.py --expected-sha "$MOONJUST_EXPECTED_HEAD_SHA" --report linux-x86_64=evidence/performance/linux-x86_64/results.json --report macos-aarch64=evidence/performance/macos-aarch64/results.json --report windows-x86_64=evidence/performance/windows-x86_64/results.json --output evidence/performance/results.json
      - name: Validate and aggregate evidence
        if: always()
        run: >-
          python tools/release/generate_release_evidence.py \
            --mode release \
            --test-map tests/upstream/just-1.57.0/test-map.jsonl \
            --contract-results evidence/contracts/results.jsonl \
            --compat-report linux-x86_64=evidence/linux-x86_64/upstream-harness/compatibility-report.jsonl \
            --platform-evidence linux-x86_64=evidence/linux-x86_64/verification/release-platform.json \
            --platform-evidence macos-aarch64=evidence/macos-aarch64/verification/release-platform.json \
            --platform-evidence windows-x86_64=evidence/windows-x86_64/verification/release-platform.json \
            --official-evidence linux-x86_64=evidence/linux-x86_64/verification/release-official.json \
            --coverage _build/coverage/summary.json \
            --coverage-metadata native=_build/coverage/native.metadata.json \
            --coverage-metadata wasm=_build/coverage/wasm.metadata.json \
            --performance evidence/performance/results.json \
            --size-report linux-x86_64=evidence/linux-x86_64/release/artifact-size-linux-x86_64.json \
            --size-report macos-aarch64=evidence/macos-aarch64/release/artifact-size-macos-aarch64.json \
            --size-report windows-x86_64=evidence/windows-x86_64/release/artifact-size-windows-x86_64.json \
            --native linux-x86_64=evidence/linux-x86_64/release/build/native/release/build/cmd/just/just.exe \
            --native macos-aarch64=evidence/macos-aarch64/release/build/native/release/build/cmd/just/just.exe \
            --native windows-x86_64=evidence/windows-x86_64/release/build/native/release/build/cmd/just/just.exe \
            --wasm evidence/wasm1/just.wasm \
            --build-proof linux-x86_64=evidence/linux-x86_64/release/build-linux-x86_64.json \
            --build-proof macos-aarch64=evidence/macos-aarch64/release/build-macos-aarch64.json \
            --build-proof windows-x86_64=evidence/windows-x86_64/release/build-windows-x86_64.json \
            --repeatability linux-x86_64=evidence/linux-x86_64/release/repeatability-linux-x86_64.json \
            --repeatability macos-aarch64=evidence/macos-aarch64/release/repeatability-macos-aarch64.json \
            --repeatability windows-x86_64=evidence/windows-x86_64/release/repeatability-windows-x86_64.json \
            --repeatability wasm1=evidence/wasm1/repeatability.json \
            --output _build/release-evidence.json \
            --strict
      - name: Enforce all release jobs
        if: always()
        run: python tools/verification/ci.py require-results "${{ needs.correctness.result }}" "${{ needs['wasm-asset'].result }}" "${{ needs.artifacts.result }}" "${{ needs.contracts.result }}" "${{ needs.coverage-native.result }}" "${{ needs.coverage-wasm.result }}" "${{ needs.performance.result }}"
      - name: Upload complete evidence record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-release-evidence
          path: _build/release-evidence.json
          if-no-files-found: error
