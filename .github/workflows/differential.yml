name: Upstream differential

on:
  merge_group:
  pull_request:
  push:
    branches: [main]

env:
  MOON_SEPARATE_COMPILATION: "1"

permissions:
  contents: read

concurrency:
  group: differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact:
    name: Build shared Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: latest
      - run: moon version --all
      - run: moon update
      - run: moon build --release --target wasm .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: moonjust-wasm
          path: _build/wasm/release/build/MoonJust.wasm
          if-no-files-found: error

  compatibility:
    needs: artifact
    name: just 1.59 differential (${{ matrix.os }}, wasm)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: latest
      - run: moon update
      - run: cargo install just --version 1.59.0 --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: moonjust-wasm
          path: _build/wasm/release/build
      - run: moon build --release --target native ./tests/wasm_reentry
      - run: moon run --target native ./tests/compat -- --candidate _build/wasm/release/build/MoonJust.wasm --candidate-runner moonrun --wasm-reentry _build/native/release/build/tests/wasm_reentry/wasm_reentry.exe --official just --strict-coverage --allow-deferred-platform --execution-target wasm --coverage-report _build/coverage.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: compatibility-${{ matrix.os }}-wasm
          path: _build/coverage.json
          if-no-files-found: error

  compatibility-merge:
    # GitHub branch protection currently requires this exact check name.
    name: just 1.57 differential
    if: always()
    needs: [artifact, compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Require every host to succeed
        if: needs.artifact.result != 'success' || needs.compatibility.result != 'success'
        run: exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: latest
      - run: moon update
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: compatibility-*
          path: _coverage
      - run: moon run --target native ./tests/coverage_merge -- --target wasm --output _build/coverage-wasm.json _coverage/compatibility-ubuntu-latest-wasm/coverage.json _coverage/compatibility-macos-latest-wasm/coverage.json _coverage/compatibility-windows-latest-wasm/coverage.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compatibility-aggregate
          path: _build/coverage-*.json
          if-no-files-found: error
