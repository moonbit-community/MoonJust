name: MoonX release verification

on: workflow_dispatch

permissions:
  contents: read

jobs:
  verify:
    name: Published Wasm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7
        with:
          version: latest
      - run: moon version --all
      - run: moon update
      - run: moonx --version
      - run: cargo install just --version 1.57.0 --locked
      - run: moon run --target native ./tests/moonx -- --report _build/moonx-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: moonx-${{ matrix.os }}
          path: _build/moonx-report.json
          if-no-files-found: error
