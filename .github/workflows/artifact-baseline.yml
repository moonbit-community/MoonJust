name: Rebuild frozen artifact baseline

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONJUST_BASELINE_COMMIT: 573792ffc7bf61c3a423920b433a2a8bc80df3b0

jobs:
  wasm1:
    name: Repeat Ubuntu wasm1 baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out evidence tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: evidence-tools
          persist-credentials: false
      - uses: ./evidence-tools/.github/actions/setup-python
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_BASELINE_COMMIT }}
          path: baseline-source
          persist-credentials: false
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - name: Apply latest MoonBit baseline compatibility patch
        run: git -C baseline-source apply "${{ github.workspace }}/evidence-tools/tools/release/latest-moonbit-baseline.patch"
      - run: python evidence-tools/tools/release/ensure_moonx.py
      - run: moon -C baseline-source update
      - run: moon -C baseline-source install
      - name: Build wasm1 repeat 1 without shared build cache
        env:
          MOON_DEP_CACHE: "off"
          MOON_BUILD_CACHE: "off"
        run: moon -C baseline-source build --frozen --release --strip --target wasm --target-dir _build/repeat-1 cmd/just
      - name: Build wasm1 repeat 2 without shared build cache
        env:
          MOON_DEP_CACHE: "off"
          MOON_BUILD_CACHE: "off"
        run: moon -C baseline-source build --frozen --release --strip --target wasm --target-dir _build/repeat-2 cmd/just
      - name: Stage and verify baseline wasm1
        run: python evidence-tools/tools/verification/ci.py stage-baseline-wasm --repo baseline-source --source baseline-source/_build/repeat-1/wasm/release/build/cmd/just/just.wasm --repeat baseline-source/_build/repeat-2/wasm/release/build/cmd/just/just.wasm --out _build/shared-wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-baseline-wasm1
          path: _build/shared-wasm/**
          if-no-files-found: error

  native:
    name: Repeat ${{ matrix.platform }} build ${{ matrix.repeat }}
    needs: wasm1
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            repeat: 1
          - os: ubuntu-latest
            platform: linux-x86_64
            repeat: 2
          - os: macos-latest
            platform: macos-aarch64
            repeat: 1
          - os: macos-latest
            platform: macos-aarch64
            repeat: 2
          - os: windows-latest
            platform: windows-x86_64
            repeat: 1
          - os: windows-latest
            platform: windows-x86_64
            repeat: 2
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out evidence tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: evidence-tools
          persist-credentials: false
      - uses: ./evidence-tools/.github/actions/setup-python
      - name: Check out frozen source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_BASELINE_COMMIT }}
          path: baseline-source
          persist-credentials: false
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - name: Apply latest MoonBit baseline compatibility patch
        run: git -C baseline-source apply "${{ github.workspace }}/evidence-tools/tools/release/latest-moonbit-baseline.patch"
      - run: python evidence-tools/tools/release/ensure_moonx.py
      - run: moon -C baseline-source update
      - run: moon -C baseline-source install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moonjust-baseline-wasm1
          path: _build/shared-wasm
      - name: Build frozen native release and analysis sibling
        env:
          MOON_DEP_CACHE: "off"
          MOON_BUILD_CACHE: "off"
        run: python evidence-tools/tools/verification/ci.py baseline-platform --repo baseline-source --tools evidence-tools --platform "${{ matrix.platform }}" --wasm _build/shared-wasm/just.wasm --baseline evidence-tools/compat/artifact-size-baseline.json --source-commit "${{ env.MOONJUST_BASELINE_COMMIT }}" --output "_build/artifact-size-${{ matrix.platform }}-${{ matrix.repeat }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-baseline-${{ matrix.platform }}-${{ matrix.repeat }}
          path: _build/artifact-size-*.json
          if-no-files-found: error

  proposal:
    name: Produce audited baseline proposal
    needs: [wasm1, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: moonjust-baseline-*-*
          path: _build/baseline-reports
          merge-multiple: true
      - name: Verify repeat hashes and preserve frozen values
        run: python tools/release/freeze_artifact_baseline.py --baseline compat/artifact-size-baseline.json --report _build/baseline-reports/artifact-size-linux-x86_64-1.json --report _build/baseline-reports/artifact-size-linux-x86_64-2.json --report _build/baseline-reports/artifact-size-macos-aarch64-1.json --report _build/baseline-reports/artifact-size-macos-aarch64-2.json --report _build/baseline-reports/artifact-size-windows-x86_64-1.json --report _build/baseline-reports/artifact-size-windows-x86_64-2.json --output _build/artifact-size-baseline.proposed.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-artifact-baseline-proposal
          path: |
            _build/artifact-size-baseline.proposed.json
            _build/baseline-reports/*.json
          if-no-files-found: error
