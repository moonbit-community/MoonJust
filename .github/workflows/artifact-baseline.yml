name: Rebuild frozen artifact baseline

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONJUST_BASELINE_COMMIT: 573792ffc7bf61c3a423920b433a2a8bc80df3b0

jobs:
  wasm1:
    name: Repeat Ubuntu wasm1 baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out evidence tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: evidence-tools
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_BASELINE_COMMIT }}
          path: baseline-source
          persist-credentials: false
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - name: Add Git Bash to Windows PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'
      - name: Apply latest MoonBit baseline compatibility patch
        run: git -C baseline-source apply "$GITHUB_WORKSPACE/evidence-tools/tools/release/latest-moonbit-baseline.patch"
      - run: ./baseline-source/tools/release/ensure_moonx.sh
      - run: |
          moon -C baseline-source update
          moon -C baseline-source install
      - name: Build wasm1 twice without shared build cache
        shell: bash
        run: |
          for repeat in 1 2; do
            MOON_DEP_CACHE=off MOON_BUILD_CACHE=off moon -C baseline-source build \
              --frozen --release --strip --target wasm \
              --target-dir "_build/repeat-$repeat" cmd/just
          done
          mkdir -p _build/shared-wasm
          cp baseline-source/_build/repeat-1/wasm/release/build/cmd/just/just.wasm \
            _build/shared-wasm/just.wasm
          cp baseline-source/_build/repeat-2/wasm/release/build/cmd/just/just.wasm \
            _build/shared-wasm/just.repeat.wasm
      - name: Require byte-for-byte reproducibility
        shell: bash
        run: |
          cmp _build/shared-wasm/just.wasm _build/shared-wasm/just.repeat.wasm
          sha256sum _build/shared-wasm/just.wasm | \
            sed 's#_build/shared-wasm/##' > _build/shared-wasm/just.wasm.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-baseline-wasm1
          path: _build/shared-wasm/**
          if-no-files-found: error

  native:
    name: Repeat ${{ matrix.platform }} build ${{ matrix.repeat }}
    needs: wasm1
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            repeat: 1
          - os: ubuntu-latest
            platform: linux-x86_64
            repeat: 2
          - os: macos-latest
            platform: macos-aarch64
            repeat: 1
          - os: macos-latest
            platform: macos-aarch64
            repeat: 2
          - os: windows-latest
            platform: windows-x86_64
            repeat: 1
          - os: windows-latest
            platform: windows-x86_64
            repeat: 2
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out evidence tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: evidence-tools
          persist-credentials: false
      - name: Check out frozen source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.MOONJUST_BASELINE_COMMIT }}
          path: baseline-source
          persist-credentials: false
      - uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: latest
      - name: Apply latest MoonBit baseline compatibility patch
        run: git -C baseline-source apply "$GITHUB_WORKSPACE/evidence-tools/tools/release/latest-moonbit-baseline.patch"
      - run: ./baseline-source/tools/release/ensure_moonx.sh
        shell: bash
      - run: |
          moon -C baseline-source update
          moon -C baseline-source install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        with:
          name: moonjust-baseline-wasm1
          path: _build/shared-wasm
      - name: Build frozen native release and analysis sibling
        shell: bash
        run: |
          archive=$(cd baseline-source && \
            MOON_DEP_CACHE=off MOON_BUILD_CACHE=off \
            MOONJUST_REQUIRE_CLEAN=0 \
            MOONJUST_RELEASE_PLATFORM="${{ matrix.platform }}" \
            MOONJUST_WASM_ASSET="$GITHUB_WORKSPACE/_build/shared-wasm/just.wasm" \
            ./tools/release/build_artifacts.sh)
          moon -C baseline-source build --frozen --release --no-strip \
            --target native --target-dir _build/size-debug cmd/just
          python3 evidence-tools/tools/release/check_artifact_size.py \
            --baseline evidence-tools/compat/artifact-size-baseline.json \
            --platform "${{ matrix.platform }}" \
            --source-commit "$MOONJUST_BASELINE_COMMIT" \
            --source-patch evidence-tools/tools/release/latest-moonbit-baseline.patch \
            --native baseline-source/_build/release/build/native/release/build/cmd/just/just.exe \
            --wasm _build/shared-wasm/just.wasm \
            --native-debug baseline-source/_build/size-debug/native/release/build/cmd/just/just.exe \
            --archive "$archive" \
            --report-only \
            --output "_build/artifact-size-${{ matrix.platform }}-${{ matrix.repeat }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-baseline-${{ matrix.platform }}-${{ matrix.repeat }}
          path: _build/artifact-size-*.json
          if-no-files-found: error

  proposal:
    name: Produce audited baseline proposal
    needs: [wasm1, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        with:
          pattern: moonjust-baseline-*-*
          path: _build/baseline-reports
          merge-multiple: true
      - name: Verify repeat hashes and preserve frozen values
        shell: bash
        run: |
          python3 tools/release/freeze_artifact_baseline.py \
            --baseline compat/artifact-size-baseline.json \
            --report _build/baseline-reports/artifact-size-linux-x86_64-1.json \
            --report _build/baseline-reports/artifact-size-linux-x86_64-2.json \
            --report _build/baseline-reports/artifact-size-macos-aarch64-1.json \
            --report _build/baseline-reports/artifact-size-macos-aarch64-2.json \
            --report _build/baseline-reports/artifact-size-windows-x86_64-1.json \
            --report _build/baseline-reports/artifact-size-windows-x86_64-2.json \
            --output _build/artifact-size-baseline.proposed.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonjust-artifact-baseline-proposal
          path: |
            _build/artifact-size-baseline.proposed.json
            _build/baseline-reports/*.json
          if-no-files-found: error
